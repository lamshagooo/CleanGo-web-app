
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">

                    <p class="subtitle">JOIN CLEANGO</p>
                    <h1 class="h2 mb-3">Create an account</h1>

                    <form>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="first-name"
                                       class="form-label">First name</label>
                                <input type="text" id="first-name"
                                       class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label for="last-name"
                                       class="form-label">Last name</label>
                                <input type="text" id="last-name"
                                       class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="register-email"
                                   class="form-label">Email</label>
                            <input type="email" id="register-email"
                                   class="form-control"
                                    pattern="[^@ ]+@[^@ ]+\.[a-zA-Z]{2,}"
                                        title="Enter a valid email, e.g. name@gmail.com"
                                       required>
                        </div>

                        <div class="mb-3">
                            <label for="register-role"
                                   class="form-label">Register as</label>
                            <select id="register-role"
                                    class="form-select">
                                <option value="customer">Customer</option>
                                <option value="cleaner">Cleaner</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="register-password"
                                   class="form-label">Password</label>
                            <input type="password"
                                   id="register-password"
                                   minlength="8"
                                   pattern="(?=.*[A-Z])(?=.*[^a-zA-Z0-9]).{8,}"
                                   class="form-control" 
                                    title="Password must contain at least 8 characters, one uppercase letter and one special character."
                                   
                                   required>
                                    <div class="form-text">
                                        Minimum 8 characters, one uppercase letter
                                        and one special character.
                                    </div>
                        </div>

                        <button type="submit"
                                class="btn btn-success w-100">
                            Create Account
                        </button>
                    </form>

                    <p class="text-center mt-4 mb-0">
                        Already have an account?
                        <a href="#login">Log in</a>
                    </p>

                    <p class="small text-muted text-center mt-3">
                        Demo only — registration is not active yet.
                    </p>

                </div>
            </div>
        </div>
    </div>
</section>
