
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8 col-xl-7">

            <a href="#cleaners"
               class="text-decoration-none"
               style="color: #718F79;">
                &larr; Back to cleaners
            </a>

            <div class="card border-0 shadow-sm mt-3">
                <div class="card-body p-4 p-md-5">

                    <p class="subtitle mb-2">
                        BOOK YOUR CLEANING
                    </p>

                    <h1 class="h2 mb-2">
                        Schedule a visit
                    </h1>

                    <p class="text-muted mb-4">
                        Choose a service and a time
                        that works for you.
                    </p>

                    <form id="booking-form">

                        <!-- Selected Cleaner -->
                        <div class="mb-3">
                            <label for="cleaner-name"
                                   class="form-label">
                                Selected cleaner
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="cleaner-name"
                                value="Amila H."
                                readonly
                            >
                        </div>

                        <!-- Cleaning Service -->
                        <div class="mb-3">
                            <label for="cleaning-service"
                                   class="form-label">
                                Cleaning service
                            </label>

                            <select
                                class="form-select"
                                id="cleaning-service"
                                required
                            >
                                <option value="" selected disabled>
                                    Select a service
                                </option>
                                <option value="home">
                                    Home Cleaning
                                </option>
                                <option value="deep">
                                    Deep Cleaning
                                </option>
                            </select>
                        </div>

                        <!-- Date and Time -->
                        <div class="row g-3">

                            <div class="col-12 col-md-6">
                                <label for="booking-date"
                                       class="form-label">
                                    Date
                                </label>

                                <input
                                    type="date"
                                    class="form-control"
                                    id="booking-date"
                                    required
                                >
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="booking-time"
                                       class="form-label">
                                    Time
                                </label>

                                <input
                                    type="time"
                                    class="form-control"
                                    id="booking-time"
                                    required
                                >
                            </div>

                        </div>

                        <!-- Duration -->
                        <div class="mt-3 mb-4">
                            <label for="booking-duration"
                                   class="form-label">
                                Duration
                            </label>

                            <select
                                class="form-select"
                                id="booking-duration"
                                required
                            >
                                <option value="2">
                                    2 hours
                                </option>
                                <option value="3">
                                    3 hours
                                </option>
                                <option value="4">
                                    4 hours
                                </option>
                            </select>

                            <div class="form-text" id="booking-rate">
                                 Hourly rate depends on the selected cleaner.
                            </div>
                        </div>

                        <!-- Estimated Total -->
                        <div class="d-flex justify-content-between
                                    align-items-center border-top
                                    pt-3 mb-4">

                            <span class="fw-semibold">
                                Estimated total
                            </span>

                            <output
                                id="booking-estimate"
                                class="fs-5 fw-bold"
                                aria-live="polite">
                                50 KM
                            </output>
                        </div>

                        <!-- Confirm Booking -->
                        <button
                            type="submit"
                            class="btn btn-success w-100">
                            Confirm Booking
                        </button>

                        <p class="small text-muted text-center
                                  mt-3 mb-0">
                            This is a booking form preview.
                            No booking will be submitted.
                        </p>

                    </form>

                </div>
            </div>
        </div>
    </div>
</section>
