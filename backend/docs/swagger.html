<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CleanGo API</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.31.0/swagger-ui.css">
</head>
<body>
    <p>Address data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>.
        Demo searches use public addresses. See the <a href="https://operations.osmfoundation.org/policies/nominatim/">Nominatim usage policy</a>.</p>
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.31.0/swagger-ui-bundle.js"></script>
    <script>
        const base = window.location.pathname.replace(/\/docs\/?$/, '');
        SwaggerUIBundle({ url: base + '/openapi.json', dom_id: '#swagger-ui', validatorUrl: null });
    </script>
</body>
</html>
